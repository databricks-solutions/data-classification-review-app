bundle:
  name: data-classification-review

sync:
  include:
    - .build
    - demo
    - upgrade
  # include overrides .gitignore, so keep Python bytecode out explicitly.
  exclude:
    - "**/__pycache__"

variables:
  # Update to match your workspace's SQL warehouse name, or override per target below.
  warehouse_id:
    lookup:
      warehouse: "Shared endpoint"
  # Lakebase branch: projects/<project-id>/branches/<branch-id>
  # Create the Lakebase project first, then set this variable.
  lakebase_branch:
    default: ""
  # Lakebase database full path: projects/<project-id>/branches/<branch-id>/databases/<database-id>
  lakebase_database:
    default: ""
  # Lakebase endpoint host (from the branch's primary endpoint status.hosts.host).
  lakebase_host:
    default: ""
  # Lakebase endpoint name for token generation: projects/<project-id>/branches/<branch-id>/endpoints/<endpoint-id>
  lakebase_endpoint_name:
    default: ""
  admin_emails:
    default: ""
  classification_results_table:
    default: "system.data_classification.results"
  # Classification synced-table wiring — persisted by scripts/deploy.sh in
  # databricks.local.yml (see provision_classification_targets()). Defaults are empty
  # so the app starts in "sync pending" state until the first install provisions them.
  # Full UC name of the synced table (catalog.schema.table) — status lookups.
  synced_uc_name:
    default: ""
  # Postgres landing name of the synced table (schema.table) — the app's read.
  synced_pg_name:
    default: ""
  # Full UC name of the deduped view (catalog.schema.view) the app creates + owns.
  classification_view_uc:
    default: ""
  # Postgres database name of lakebase_database (e.g. "databricks_postgres"), resolved
  # by deploy.sh via `databricks postgres get-database` — not derivable from the path,
  # the resource id and the Postgres name are independent. The app connects to it
  # (LAKEBASE_DATABASE) and creates the synced table in it, as the SP.
  lakebase_logical_db:
    default: ""
  # Quartz cron for the sync job, derived from --sync-interval-hours (24h → daily).
  sync_cron:
    default: "0 0 0 */1 * ?"
  # Comma-separated identities (emails, or SP application ids) the app grants
  # CAN_MANAGE on the sync job it creates — deploy.sh sets deployer + admins.
  sync_job_managers:
    default: ""

resources:
  jobs:
    data-classification-review-demo:
      name: "data-classification-review-demo"
      parameters:
        - name: demo_mode
          default: "mock_results"
        - name: target_catalog
          default: ""
        - name: enable_dc
          default: "true"
        - name: results_table
          default: ""
      tasks:
        - task_key: route_is_mock
          condition_task:
            op: "EQUAL_TO"
            left: "{{job.parameters.demo_mode}}"
            right: "mock_results"
        - task_key: mock_classification_results
          depends_on:
            - task_key: route_is_mock
              outcome: "true"
          notebook_task:
            notebook_path: ${workspace.file_path}/demo/notebooks/03_mock_classification_results
            base_parameters:
              results_table: "{{job.parameters.results_table}}"
        - task_key: route_is_single_catalog
          depends_on:
            - task_key: route_is_mock
              outcome: "false"
          condition_task:
            op: "EQUAL_TO"
            left: "{{job.parameters.demo_mode}}"
            right: "single_catalog"
        - task_key: create_demo_single_catalog
          depends_on:
            - task_key: route_is_single_catalog
              outcome: "true"
          notebook_task:
            notebook_path: ${workspace.file_path}/demo/notebooks/02_create_demo_single_catalog
            base_parameters:
              target_catalog: "{{job.parameters.target_catalog}}"
              enable_dc: "{{job.parameters.enable_dc}}"
        - task_key: create_demo_multiple_catalogs
          depends_on:
            - task_key: route_is_single_catalog
              outcome: "false"
          notebook_task:
            notebook_path: ${workspace.file_path}/demo/notebooks/01_create_demo_multiple_catalogs
            base_parameters:
              enable_dc: "{{job.parameters.enable_dc}}"

    # NB: the classification_sync job is NOT a bundle resource. At startup the app,
    # running as its service principal, creates the view + synced table and then this
    # job — a single pipeline task that refreshes the synced table's pipeline on
    # ${var.sync_cron} (backend/db/classification_provision.py). Created by the SP, the
    # job runs as the SP without a run_as override, which would need the
    # "Service Principal User" role on the SP.

  apps:
    data-classification-review-app:
      name: "data-classification-review-app"
      description: "data-classification-review created with apx"
      source_code_path: ./.build
      user_api_scopes:
        - sql
        - catalog.catalogs:read
        - catalog.schemas:read
        - catalog.tables:read
      permissions:
        - group_name: users
          level: CAN_USE
      resources:
        - name: warehouse
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"
        - name: lakebase
          postgres:
            branch: ${var.lakebase_branch}
            database: ${var.lakebase_database}
            permission: "CAN_CONNECT_AND_CREATE"
      config:
        env:
          - name: USE_MOCK_DATA
            value: "false"
          - name: CLASSIFICATION_RESULTS_TABLE
            value: ${var.classification_results_table}
          - name: WAREHOUSE_ID
            value: ${var.warehouse_id}
          - name: LAKEBASE_HOST
            value: ${var.lakebase_host}
          # Same database as CLASSIFICATION_SYNC_PG_DATABASE: the app reads the synced
          # table from the database it connects to.
          - name: LAKEBASE_DATABASE
            value: ${var.lakebase_logical_db}
          - name: LAKEBASE_ENDPOINT_NAME
            value: ${var.lakebase_endpoint_name}
          - name: ADMIN_EMAILS
            value: ${var.admin_emails}
          - name: CLASSIFICATION_SYNCED_TABLE
            value: ${var.synced_pg_name}
          - name: CLASSIFICATION_SYNCED_TABLE_UC
            value: ${var.synced_uc_name}
          # What the app provisions (as its SP) at startup: the view it creates + owns,
          # the Lakebase Autoscaling target of the synced table (project branch +
          # Postgres database), the refresh job's cadence, and the identities granted
          # CAN_MANAGE on that job.
          - name: CLASSIFICATION_VIEW_UC
            value: ${var.classification_view_uc}
          - name: CLASSIFICATION_SYNC_BRANCH
            value: ${var.lakebase_branch}
          - name: CLASSIFICATION_SYNC_PG_DATABASE
            value: ${var.lakebase_logical_db}
          - name: CLASSIFICATION_SYNC_CRON
            value: ${var.sync_cron}
          - name: CLASSIFICATION_SYNC_JOB_MANAGERS
            value: ${var.sync_job_managers}

targets:
  dev:
    mode: development
    default: true

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}
    # Deployment-specific infrastructure values (warehouse name, Lakebase project/branch/
    # endpoint/host) are environment-specific and must NOT be committed. Set them in the
    # git-ignored databricks.local.yml, which overrides `targets.prod.variables`.
    # See databricks.local.yml.example for the required shape.
    variables:
      warehouse_id:
        lookup:
          warehouse: "Shared endpoint"
      lakebase_branch: ""
      lakebase_database: ""
      lakebase_host: ""
      lakebase_endpoint_name: ""

include:
  - databricks.local.yml
